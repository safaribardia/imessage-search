name: IMessageSearch
options:
  bundleIdPrefix: com.olive
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 29ZVM64GLU
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
targets:
  MsgTool:
    type: tool
    platform: macOS
    sources:
      - MsgTool
      - IMessageSearch/Models.swift
      - IMessageSearch/MessagesReader.swift
      - IMessageSearch/ConversationChunker.swift
      - IMessageSearch/IndexStore.swift
      - IMessageSearch/OllamaClient.swift
      - IMessageSearch/SearchEngine.swift
      - IMessageSearch/CodexAgent.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: msgtool
        SWIFT_VERSION: "6.0"
  IMessageSearch:
    type: application
    platform: macOS
    sources:
      - IMessageSearch
    dependencies:
      - sdk: libsqlite3.tbd
      - target: MsgTool
        embed: false
      - package: Sparkle
    info:
      path: IMessageSearch/Info.plist
      properties:
        SUFeedURL: https://raw.githubusercontent.com/safaribardia/imessage-search/main/appcast.xml
        SUPublicEDKey: sZgdCL1p65dGDZ3aq6eJbkMNuPTOke29yEKsJxEnQhs=
        # Resolved per configuration so Sparkle never replaces a dev build
        # with the released app.
        SUEnableAutomaticChecks: $(SU_ENABLE_UPDATES)
        SUAutomaticallyUpdate: $(SU_ENABLE_UPDATES)
        SUScheduledCheckInterval: 3600
    postBuildScripts:
      - name: Bundle msgtool helper
        script: cp "$BUILT_PRODUCTS_DIR/msgtool" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/msgtool"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olive.imessagesearch
        PRODUCT_NAME: iMessage Search
        CODE_SIGN_ENTITLEMENTS: IMessageSearch/IMessageSearch.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iMessage Search
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSContactsUsageDescription: Shows contact names instead of phone numbers in search results and answers.
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SU_ENABLE_UPDATES: "YES"
      configs:
        # Debug builds are a separate app: own bundle id, name, and a
        # DEV-badged icon, with Sparkle updates off.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.olive.imessagesearch.dev
          PRODUCT_NAME: iMessage Search Dev
          INFOPLIST_KEY_CFBundleDisplayName: iMessage Search Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          SU_ENABLE_UPDATES: "NO"
